name: CI - Pao de Itapeba

on:
  push:
    branches:
      - main
      - feature/cadastro-itens

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilacao e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar sintaxe do projeto
        run: |
          python -m compileall -q app run.py config.py

      - name: Executar testes automatizados
        run: |
          python -m pytest -v